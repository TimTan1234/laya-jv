services:
  laya:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        LAYA_MODEL: ${LAYA_MODEL:-multilingual}
    image: laya-decision:latest
    container_name: laya-decision
    restart: unless-stopped
    environment:
      LAYA_MODEL: ${LAYA_MODEL:-multilingual}
      OMP_NUM_THREADS: ${OMP_NUM_THREADS:-4}
    ports:
      - "${LAYA_PORT:-8100}:8100"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8100/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 120s
